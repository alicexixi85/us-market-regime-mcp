[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "us-market-regime-mcp"
version = "0.2.0"
description = "MCP server for rule-based U.S. market regime signals (QQQ, VIX, distribution days) and prop-firm drawdown math."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://signal.usethelever.com"
"Remote MCP" = "https://mcp.usethelever.com/market-regime/mcp"
"Blind Replay Trainer" = "https://replay.usethelever.com/mds/en/trial"

[project.scripts]
us-market-regime-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "mcp_stdio"]
